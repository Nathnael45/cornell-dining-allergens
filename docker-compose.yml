# Local Postgres for development. Production uses a hosted Postgres (e.g. Neon) via DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dining
      POSTGRES_PASSWORD: dining
      POSTGRES_DB: dining
    ports:
      - "5433:5432" # 5433 to avoid clashing with any Postgres already on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dining"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
